<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="QA notes captured on merge requests are compiled by a workflow when the ticket moves to QA, approved by a human in Slack, then written once to the Jira ticket. A digest stops repeat runs.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#0f172a"/>

  <text x="80" y="96" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f1f5f9">Capturing QA context before it evaporates</text>
  <text x="80" y="138" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">Merge-request notes to the Jira ticket, with a human gate and a digest that makes re-runs free</text>

  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e2e8f0" text-anchor="middle">

    <!-- Row 1: trigger path -->
    <rect x="80" y="250" width="200" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="180" y="288" font-weight="600">Jira ticket</text>
    <text x="180" y="314" fill="#94a3b8" font-size="15">moves to QA column</text>

    <line x1="280" y1="296" x2="350" y2="296" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="315" y="282" font-size="13" fill="#94a3b8">Jira rule</text>

    <rect x="350" y="250" width="200" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="450" y="288" font-weight="600">Lambda</text>
    <text x="450" y="314" fill="#94a3b8" font-size="15">shared secret, 10 min key</text>

    <line x1="550" y1="296" x2="620" y2="296" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="585" y="282" font-size="13" fill="#94a3b8">trigger</text>

    <rect x="620" y="232" width="240" height="128" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="740" y="266" font-weight="600">Trigger.dev workflow</text>
    <text x="740" y="292" fill="#94a3b8" font-size="15">gather, digest, compile</text>
    <text x="740" y="314" fill="#94a3b8" font-size="15">wait up to 48 h</text>
    <text x="740" y="340" fill="#94a3b8" font-size="15">publish</text>

    <line x1="860" y1="296" x2="930" y2="296" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="895" y="282" font-size="13" fill="#94a3b8">upsert</text>

    <rect x="930" y="250" width="190" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="1025" y="288" font-weight="600">Jira comment</text>
    <text x="1025" y="314" fill="#94a3b8" font-size="15">one, marker-tagged</text>

    <!-- Input: GitLab MRs feed gather -->
    <rect x="330" y="440" width="240" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="450" y="478" font-weight="600">Merged merge requests</text>
    <text x="450" y="504" fill="#94a3b8" font-size="15">QA notes: bullets</text>

    <path d="M570 486 L660 486 L660 360" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="615" y="474" font-size="13" fill="#94a3b8">reads notes</text>

    <!-- Human gate: Slack -->
    <rect x="700" y="440" width="220" height="92" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="810" y="478" font-weight="600" fill="#e0f2fe">Slack DM</text>
    <text x="810" y="504" fill="#bae6fd" font-size="15">assignee approves</text>

    <line x1="760" y1="360" x2="760" y2="440" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <text x="748" y="404" font-size="13" fill="#7dd3fc" text-anchor="end">proposed note</text>
    <line x1="850" y1="440" x2="850" y2="360" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <text x="862" y="404" font-size="13" fill="#7dd3fc" text-anchor="start">approve / reject</text>

    <!-- Digest loop -->
    <path d="M1025 250 L1025 190 L740 190 L740 232" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-dim)"/>
    <text x="882" y="180" font-size="13" fill="#94a3b8">digest unchanged: stop before compile</text>
  </g>

  <text x="80" y="590" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#64748b">teodorkurtev.com</text>
</svg>
