version: 2
updates:
  # One grouped PR per ecosystem per week — the backlog of single-package PRs
  # was never going to be merged one at a time on a site this small.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # astro check and typescript-eslint need the TS 6 programmatic API;
      # TS 7 breaks both (withastro/roadmap#1321). Lift when they support it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns:
          - '*'
